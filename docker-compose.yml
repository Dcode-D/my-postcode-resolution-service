services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postcode_service
      POSTGRES_USER: postcode
      POSTGRES_PASSWORD: postcode
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postcode -d postcode_service']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'

  api:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://postcode:postcode@postgres:5432/postcode_service
      SANITIZE_ENABLED: ${SANITIZE_ENABLED:-true}
      MODELS_DEFAULT_PROVIDER: ${MODELS_DEFAULT_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      RESOLUTION_SETTINGS_CACHE_TTL_SECONDS: ${RESOLUTION_SETTINGS_CACHE_TTL_SECONDS:-300}
      MODEL_CACHE_TTL_SECONDS: ${MODEL_CACHE_TTL_SECONDS:-86400}
      MODEL_CACHE_MAX_ENTRIES: ${MODEL_CACHE_MAX_ENTRIES:-1000}
      MODEL_PRICING_CACHE_TTL_SECONDS: ${MODEL_PRICING_CACHE_TTL_SECONDS:-3600}
      LOGS_API_KEY: ${LOGS_API_KEY:-}
    ports:
      - '${API_HOST_PORT:-3000}:${PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
